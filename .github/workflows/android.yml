name: Android Release APK

on:
  push:
    tags: ["v*"]
    branches: [main, dev]
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Release tag (e.g. v1.0.0). If set, publishes a GitHub Release."
        required: false
        default: ""
      draft:
        description: "Create draft release?"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build-prod-release:
    name: Android · APKs (arm64, v7a, x86_64, universal)
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Setup Secrets & Keystore
      run: |
        echo "LASTFM_API_KEY=${{ secrets.LASTFM_API_KEY }}" > local.properties
        echo "LASTFM_SECRET=${{ secrets.LASTFM_SECRET }}" >> local.properties
        echo "LISTEN_TOGETHER_SERVER=${{ secrets.LISTEN_TOGETHER_SERVER }}" >> local.properties

        if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
          echo "Decoding provided release keystore..."
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > bitchord-release.jks
          {
            echo "storeFile=bitchord-release.jks"
            echo "storePassword=${{ secrets.KEYSTORE_PASSWORD }}"
            echo "keyAlias=${{ secrets.KEY_ALIAS }}"
            echo "keyPassword=${{ secrets.KEY_PASSWORD }}"
          } > keystore.properties
        else
          echo "No KEYSTORE_BASE64 secret provided; generating self-signed release keystore for build..."
          keytool -genkeypair -v -keystore bitchord-release.jks \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -alias bitchord -storepass android -keypass android \
            -dname "CN=BitChord, OU=BitChord, O=BitChord, L=Unknown, ST=Unknown, C=US"
          {
            echo "storeFile=bitchord-release.jks"
            echo "storePassword=android"
            echo "keyAlias=bitchord"
            echo "keyPassword=android"
          } > keystore.properties
        fi

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build Signed Prod Release APK
      run: ./gradlew :app:assembleProdRelease

    - name: Collect Release APKs
      run: |
        version="${{ inputs.tag_name }}"
        [ -n "$version" ] || version="${GITHUB_REF_NAME#v}"
        [ -n "$version" ] || version="dev"

        mkdir -p release-apks
        cp app/build/outputs/apk/prod/release/app-prod-universal-release.apk "release-apks/BitChord-${version}-universal.apk" || true
        cp app/build/outputs/apk/prod/release/app-prod-arm64-v8a-release.apk "release-apks/BitChord-${version}-arm64-v8a.apk" || true
        cp app/build/outputs/apk/prod/release/app-prod-armeabi-v7a-release.apk "release-apks/BitChord-${version}-armeabi-v7a.apk" || true
        cp app/build/outputs/apk/prod/release/app-prod-x86_64-release.apk "release-apks/BitChord-${version}-x86_64.apk" || true
        ls -lh release-apks

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: bitchord-prod-release-signed
        path: release-apks/*

    - name: Upload Wear OS APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: bitchord-wear-prod-release-signed
        path: wearos/build/outputs/apk/prod/release/*.apk

    - name: Publish GitHub Release
      if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.tag_name != '')
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ inputs.tag_name || github.ref_name }}
        name: BitChord ${{ inputs.tag_name || github.ref_name }}
        draft: ${{ inputs.draft || false }}
        prerelease: false
        generate_release_notes: true
        files: release-apks/*
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

